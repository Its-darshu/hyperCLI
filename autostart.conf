#################
### AUTOSTART ###
#################

# Synchronize session environment variables with DBus and systemd for portals & screen sharing
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# XWayland Video Bridge (Enables Discord and X11 apps to capture Wayland screens/windows)
exec-once = xwaylandvideobridge

# Status bar — the autohide script owns waybar's lifecycle so its
# show/hide state is always known (prevents inverted-hover desync).
# It starts hidden and reveals on bottom-edge hover.
exec-once = ~/.config/hypr/scripts/waybar-autohide.sh

# Window-switcher daemon (Alt+Tab / Super+Tab) — Liquid Glass macOS Switcher
exec-once = ~/.config/hypr/scripts/switcher.sh init

# Notifications
exec-once = dunst

# Network tray applet
exec-once = nm-applet --indicator

# Polkit auth agent (try KDE KF6, KDE KF5, fallback to GNOME)
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1

# Live Wallpaper Shifter autostart
exec-once = ~/.config/hypr/scripts/wallpaper-shift.sh init

# Clipboard manager — two watchers needed for text AND image support
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle daemon (dims/locks after inactivity)
exec-once = hypridle

# Bluetooth
exec-once = rfkill unblock bluetooth
exec-once = blueman-applet
exec-once = /usr/libexec/gsd-rfkill

# Open a blank terminal on workspace 1 at startup
exec-once = $terminal
