general {
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen after 4 minutes
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 30%
    on-resume  = brightnessctl -r
}

# Lock screen after 5 minutes
listener {
    timeout  = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 8 minutes
listener {
    timeout  = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 15 minutes.
# suspend-then-hibernate, not plain suspend: this laptop has no S3 state, so it
# can only s2idle. That keeps drawing power and has been known to hang on wake,
# so systemd flips it to a real hibernate after HibernateDelaySec
# (see /etc/systemd/sleep.conf.d/10-hibernate-fallback.conf).
listener {
    timeout  = 900
    on-timeout = systemctl suspend-then-hibernate || systemctl suspend
}
